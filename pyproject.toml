[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicqwebbot"
version = "0.3.0"
description = "AicqWebBot - Your browser is the agent's container. pip install, run one line, chat with your agent on localhost."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SamAI" }]
keywords = ["agent", "browser", "llm", "wasm", "sandbox", "chatbot", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
extra = ["python-multipart>=0.0.6"]

[project.urls]
Homepage = "https://aicq.me"
Documentation = "https://github.com/samaidev/AicqWebBot"
Repository = "https://github.com/samaidev/AicqWebBot"

[project.scripts]
aicqwebbot = "aicqwebbot.__main__:main"

[tool.setuptools.packages.find]
include = ["aicqwebbot*"]

[tool.setuptools.package-data]
"aicqwebbot.web" = ["**/*"]
